<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Orbit Dash</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0a0a12;
    overflow: hidden;
    touch-action: none;
  }
  #game {
    display: block;
    width: 100vw;
    height: 100vh;
  }
  #hint {
    position: fixed;
    bottom: 12px;
    left: 0;
    right: 0;
    text-align: center;
    color: #6b7280;
    font: 14px system-ui, sans-serif;
    pointer-events: none;
  }
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hint">SPACE / click / tap to swap rings</div>
  <script type="module" src="dist/main.js"></script>
</body>
</html>
